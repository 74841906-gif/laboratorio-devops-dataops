services:
  postgres:
    image: postgres:16
    container_name: postgres_lab
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: laboratorio123
      POSTGRES_DB: laboratorio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
